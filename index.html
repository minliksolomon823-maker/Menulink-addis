<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MenuLink Addis V5</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f2f8f4;
 color:#183b2b
}
header{
 background:#168348;
 color:white;
 text-align:center;
 padding:22px 14px
}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}
.wrap{max-width:850px;margin:auto;padding:14px}
.card{
 background:white;
 border-radius:18px;
 padding:18px;
 margin:0 0 16px;
 box-shadow:0 3px 14px #0000000a
}
.card h2{color:#168348;margin:0 0 15px;font-size:22px}
input,select,button{
 width:100%;
 padding:13px;
 margin:7px 0;
 border:1px solid #ddd;
 border-radius:10px;
 font-size:16px
}
button{
 background:#168348;
 color:white;
 border:0;
 font-weight:bold;
 cursor:pointer
}
button.secondary{background:#e7f4ec;color:#176a3d}
button.danger{background:#d84444}
.lang{max-width:140px;margin:10px auto}
.food{
 display:flex;
 gap:12px;
 align-items:center;
 border-bottom:1px solid #eee;
 padding:12px 0
}
.food img{
 width:86px;
 height:86px;
 object-fit:cover;
 border-radius:10px
}
.food .details{flex:1}
.price{color:#168348;font-weight:bold}
.small{font-size:13px;color:#6b7b72}
.qrbox{text-align:center}
.qrbox img{width:min(260px,100%);height:auto}
.hidden{display:none!important}
.foot{text-align:center;color:#718078;padding:20px}
</style>
</head>

<body>

<header>
<h1>🍽️ MenuLink Addis</h1>
<p id="tagline">የካፌዎች ዲጂታል ሜኑ</p>

<select class="lang" id="language">
<option value="am">አማርኛ</option>
<option value="en">English</option>
</select>
</header>

<div class="wrap" id="ownerView">

<section class="card">
<h2 id="regTitle">🏪 የካፌ ምዝገባ</h2>
<input id="cafeName" placeholder="የካፌ ስም">
<input id="cafePhone" placeholder="የስልክ ቁጥር">
<input id="cafeAddress" placeholder="የካፌ አድራሻ">
<button id="saveCafe">ካፌ መመዝገብ / ማስቀመጥ</button>
</section>

<section class="card">
<h2 id="addTitle">🍔 ምግብ ወደ ሜኑ መጨመር</h2>

<select id="category">
<option value="Food">ምግብ</option>
<option value="Breakfast">ቁርስ</option>
<option value="Lunch">ምሳ</option>
<option value="Dinner">እራት</option>
<option value="Coffee">ቡና</option>
<option value="Drinks">መጠጥ</option>
<option value="Dessert">ዴሰርት</option>
</select>

<input id="foodName" placeholder="የምግብ ስም">
<input id="foodPrice" type="number" min="0" placeholder="ዋጋ (ብር)">
<input id="foodPhoto" type="file" accept="image/*">

<button id="addFood">ምግብ ጨምር</button>
</section>

<section class="card">
<h2 id="menuTitle">📖 የእኔ ሜኑ</h2>
<input id="search" placeholder="ምግብ ፈልግ...">
<div id="ownerMenu"></div>
</section>

<section class="card qrbox">
<h2 id="qrTitle">📱 የካፌ QR Code</h2>

<button id="makeQr">QR Code ፍጠር</button>

<p id="qrInfo" class="small"></p>
<div id="qrResult"></div>

<button id="copyLink" class="secondary hidden">Link ኮፒ</button>
<button id="downloadQr" class="secondary hidden">QR አውርድ</button>

<p class="small" id="qrNote">
QR ውስጥ የካፌ እና የምግብ መረጃ ይካተታል።
ፎቶዎች በQR ሊንክ ውስጥ አይካተቱም።
</p>
</section>
</div>

<div class="wrap hidden" id="customerView">
<section class="card">
<h2 id="customerCafe"></h2>
<p id="customerInfo"></p>
<input id="customerSearch" placeholder="Search menu">
<div id="customerMenu"></div>
</section>
</div>

<footer class="foot">
MenuLink Addis V5 · Developed by Minilik Solomon
</footer>

<script>
const translations={
am:{
tag:'የካፌዎች ዲጂታል ሜኑ',
reg:'🏪 የካፌ ምዝገባ',
name:'የካፌ ስም',
phone:'የስልክ ቁጥር',
address:'የካፌ አድራሻ',
save:'ካፌ መመዝገብ / ማስቀመጥ',
add:'🍔 ምግብ ወደ ሜኑ መጨመር',
food:'የምግብ ስም',
price:'ዋጋ (ብር)',
addFood:'ምግብ ጨምር',
menu:'📖 የእኔ ሜኑ',
search:'ምግብ ፈልግ...',
qr:'📱 የካፌ QR Code',
make:'QR Code ፍጠር',
note:'QR ውስጥ የካፌ እና የምግብ መረጃ ይካተታል። ፎቶዎች በQR ሊንክ ውስጥ አይካተቱም።',
remove:'አጥፋ',
empty:'ምግብ አልተጨመረም።',
customerSearch:'ሜኑ ፈልግ...',
saved:'የካፌ መረጃ ተቀምጧል።',
added:'ምግቡ ተጨምሯል።',
need:'የካፌ ስም፣ ምግብ ስም እና ዋጋ አስገባ።'
},

en:{
tag:'Digital menus for cafes',
reg:'🏪 Cafe Registration',
name:'Cafe name',
phone:'Phone number',
address:'Cafe address',
save:'Save Cafe Details',
add:'🍔 Add Menu Item',
food:'Food name',
price:'Price (ETB)',
addFood:'Add Menu Item',
menu:'📖 My Menu',
search:'Search menu...',
qr:'📱 Cafe QR Code',
make:'Generate QR Code',
note:'The QR contains cafe and menu details. Uploaded photos are not included in the QR link.',
remove:'Delete',
empty:'No menu items added yet.',
customerSearch:'Search menu...',
saved:'Cafe details saved.',
added:'Menu item added.',
need:'Enter cafe name, item name, and price.'
}
};

const $=id=>document.getElementById(id);

let lang='am';
let foods=[];
let cafe={name:'',phone:'',address:''};
let qrUrl='';

function read(){
 try{
  cafe=JSON.parse(localStorage.getItem('ml5cafe'))||cafe;
  foods=JSON.parse(localStorage.getItem('ml5foods'))||[];
 }catch(e){}
}

function save(){
 localStorage.setItem('ml5cafe',JSON.stringify(cafe));
 localStorage.setItem('ml5foods',JSON.stringify(foods));
}

function t(k){
 return translations[lang][k]||k;
}

function setLang(l){
 lang=l;
 document.documentElement.lang=l;

 const map={
  regTitle:'reg',
  addTitle:'add',
  menuTitle:'menu',
  qrTitle:'qr'
 };

 Object.keys(map).forEach(id=>{
  $(id).textContent=t(map[id]);
 });

 $('tagline').textContent=t('tag');
 $('cafeName').placeholder=t('name');
 $('cafePhone').placeholder=t('phone');
 $('cafeAddress').placeholder=t('address');
 $('foodName').placeholder=t('food');
 $('foodPrice').placeholder=t('price');
 $('search').placeholder=t('search');
 $('customerSearch').placeholder=t('customerSearch');
 $('saveCafe').textContent=t('save');
 $('addFood').textContent=t('addFood');
 $('makeQr').textContent=t('make');
 $('qrNote').textContent=t('note');

 renderOwner();
 renderCustomer();
}

function saveCafe(){
 cafe={
  name:$('cafeName').value.trim(),
  phone:$('cafePhone').value.trim(),
  address:$('cafeAddress').value.trim()
 };
 save();
 alert(t('saved'));
}

function addFood(){
 let name=$('foodName').value.trim();
 let price=$('foodPrice').value;
 let category=$('category').value;
 let file=$('foodPhoto').files[0];

 if(!cafe.name)cafe.name=$('cafeName').value.trim();

 if(!name||price===''||!cafe.name){
  alert(t('need'));
  return;
 }

 const item={name,price,category,image:''};

 if(file){
  const reader=new FileReader();

  reader.onload=()=>{
   item.image=reader.result;
   foods.push(item);
   save();
   renderOwner();
   $('foodName').value='';
   $('foodPrice').value='';
   $('foodPhoto').value='';
   alert(t('added'));
  };

  reader.readAsDataURL(file);

 }else{
  foods.push(item);
  save();
  renderOwner();
  $('foodName').value='';
  $('foodPrice').value='';
  alert(t('added'));
 }
}

function renderOwner(){
 const q=$('search').value.toLowerCase();

 $('ownerMenu').innerHTML=foods
 .filter(f=>(f.name+' '+f.category).toLowerCase().includes(q))
 .map((f,i)=>`
 <div class="food">
 ${f.image?`<img src="${f.image}" alt="${esc(f.name)}">`:''}
 <div class="details">
 <b>${esc(f.name)}</b>
 <div class="small">${esc(f.category)}</div>
 <div class="price">${esc(f.price)} ETB</div>
 </div>
 <button class="danger" style="width:auto" onclick="removeFood(${i})">
 ${t('remove')}
 </button>
 </div>
 `).join('')||`<p class="small">${t('empty')}</p>`;
}

function removeFood(i){
 foods.splice(i,1);
 save();
 renderOwner();
}

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
 '&':'&amp;',
 '<':'&lt;',
 '>':'&gt;',
 '"':'&quot;',
 "'":'&#39;'
 }[c]));
}

function renderCustomer(){
 const q=$('customerSearch').value.toLowerCase();

 $('customerCafe').textContent=cafe.name||'Cafe Menu';

 $('customerInfo').textContent=
 [cafe.phone,cafe.address].filter(Boolean).join(' · ');

 $('customerMenu').innerHTML=foods
 .filter(f=>(f.name+' '+f.category).toLowerCase().includes(q))
 .map(f=>`
 <div class="food">
 ${f.image?`<img src="${f.image}" alt="${esc(f.name)}">`:''}
 <div class="details">
 <b>${esc(f.name)}</b>
 <div class="small">${esc(f.category)}</div>
 <div class="price">${esc(f.price)} ETB</div>
 </div>
 </div>
 `).join('')||`<p>${t('empty')}</p>`;
}

function openCustomerFromData(data){
 cafe=data.cafe||{};
 foods=data.foods||[];

 $('ownerView').classList.add('hidden');
 $('customerView').classList.remove('hidden');

 renderCustomer();
}

function makeQr(){
 if(!cafe.name){
  alert(t('need'));
  return;
 }

 const payload={
  cafe:{
   name:cafe.name,
   phone:cafe.phone,
   address:cafe.address
  },
  foods:foods.map(f=>({
   name:f.name,
   price:f.price,
   category:f.category,
   image:f.image&&f.image.startsWith('http')?f.image:''
  }))
 };

 const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));

 qrUrl=location.origin+location.pathname+'?menu='+encoded;

 $('qrInfo').textContent=cafe.name+' QR Code';

 $('qrResult').innerHTML=`
 <img id="qrImage" class="qr" alt="QR code"
 src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(qrUrl)}">
 <p><a href="${qrUrl}" target="_blank">Open customer menu</a></p>
 `;

 $('copyLink').classList.remove('hidden');
 $('downloadQr').classList.remove('hidden');
}

$('saveCafe').onclick=saveCafe;
$('addFood').onclick=addFood;
$('search').oninput=renderOwner;
$('customerSearch').oninput=renderCustomer;
$('makeQr').onclick=makeQr;

$('copyLink').onclick=async()=>{
 try{
  await navigator.clipboard.writeText(qrUrl);
  alert('Link copied');
 }catch(e){
  prompt('Copy this menu link',qrUrl);
 }
};

$('downloadQr').onclick=()=>{
 const a=document.createElement('a');
 a.href=$('qrImage').src;
 a.download='MenuLink-QR.png';
 a.click();
};

$('language').onchange=e=>setLang(e.target.value);

read();

$('cafeName').value=cafe.name||'';
$('cafePhone').value=cafe.phone||'';
$('cafeAddress').value=cafe.address||'';

const params=new URLSearchParams(location.search);

if(params.has('menu')){
 try{
  const decoded=decodeURIComponent(escape(atob(params.get('menu'))));
  openCustomerFromData(JSON.parse(decoded));
 }catch(e){
  alert('Menu link invalid');
 }
}

setLang('am');
</script>

</body>
</html>
